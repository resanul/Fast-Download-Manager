[project]
name = "fast-download-manager"
version = "0.1.0"
description = "Fast Download Manager for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "httpx>=0.27"]

[project.scripts]
fast-download-manager = "fastdm.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
