name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/Fast-Download-Manager.exe -Algorithm SHA256).Hash
          "$hash  Fast-Download-Manager.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
