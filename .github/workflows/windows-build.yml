name: Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pip install -e .
      - run: ruff check .
      - run: pytest
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fast-Download-Manager-windows
          path: dist/Fast-Download-Manager.exe
