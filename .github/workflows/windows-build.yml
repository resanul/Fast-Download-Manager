name: Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair source before build
        shell: python
        run: |
          from pathlib import Path
          import re

          ui = Path("fastdm/ui.py")
          text = ui.read_text(encoding="utf-8")
          text = text.replace("        main.addWidget(side)", "        main.addLayout(side)", 1)
          ui.write_text(text, encoding="utf-8")

          engine = Path("fastdm/engine.py")
          text = engine.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)async with httpx\.AsyncClient\(follow_redirects=True, timeout=None\) as client:\n'
              r'(?P=i)    async with client\.stream\("GET", task\.url, headers=headers\) as response:'
          )
          text = pattern.sub(
              r'\g<i>async with httpx.AsyncClient(follow_redirects=True, timeout=None) as client, client.stream("GET", task.url, headers=headers) as response:',
              text,
          )
          engine.write_text(text, encoding="utf-8")

      - name: Commit repaired source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastdm/ui.py fastdm/engine.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: repair Qt layout and async context lint"
            git push origin HEAD:main
          }

      - run: pip install -r requirements.txt pyinstaller
      - run: pip install -e .
      - run: ruff check .
      - run: pytest
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fast-Download-Manager-windows
          path: dist/Fast-Download-Manager.exe
