name: Repair UI and Prepare v0.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ui-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair known runtime issues and bump release
        shell: python
        run: |
          from pathlib import Path

          ui = Path("fastdm/ui.py")
          text = ui.read_text(encoding="utf-8")
          needle = "        main.addWidget(side)"
          if needle in text:
              text = text.replace(needle, "        main.addLayout(side)", 1)
          ui.write_text(text, encoding="utf-8")

          engine = Path("fastdm/engine.py")
          text = engine.read_text(encoding="utf-8")
          old1 = '''                async with httpx.AsyncClient(follow_redirects=True, timeout=None) as client:\n                    async with client.stream("GET", task.url, headers=headers) as response:'''
          new1 = '''                async with httpx.AsyncClient(follow_redirects=True, timeout=None) as client, client.stream("GET", task.url, headers=headers) as response:'''
          text = text.replace(old1, new1)
          engine.write_text(text, encoding="utf-8")

          release = Path(".github/workflows/repair-release-012.yml")
          text = release.read_text(encoding="utf-8")
          text = text.replace("--ignore=SIM117", "")
          text = text.replace("Publish v0.1.4", "Publish v0.1.5")
          text = text.replace("tag_name: v0.1.4", "tag_name: v0.1.5")
          text = text.replace("name: Fast Download Manager v0.1.4", "name: Fast Download Manager v0.1.5")
          release.write_text(text, encoding="utf-8")

          project = Path("pyproject.toml")
          if project.exists():
              text = project.read_text(encoding="utf-8")
              text = text.replace('version = "0.1.0"', 'version = "0.1.5"', 1)
              project.write_text(text, encoding="utf-8")

      - name: Verify repaired source
        shell: python
        run: |
          import ast
          from pathlib import Path

          ui = Path("fastdm/ui.py").read_text(encoding="utf-8")
          assert "main.addLayout(side)" in ui, "sidebar must be added as a layout"
          assert "main.addWidget(side)" not in ui, "QLayout was passed to addWidget"
          ast.parse(Path("fastdm/ui.py").read_text(encoding="utf-8"))
          ast.parse(Path("fastdm/engine.py").read_text(encoding="utf-8"))
          print("UI and engine source verification passed")

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastdm/ui.py fastdm/engine.py .github/workflows/repair-release-012.yml pyproject.toml
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "fix: repair Qt layout runtime and prepare v0.1.5"
          git push origin HEAD:main

# Trigger marker: repair runtime layout before publishing v0.1.5
