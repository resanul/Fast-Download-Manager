name: Publish Fast Download Manager v0.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v016.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Qt ownership and set release version
        shell: python
        run: |
          from pathlib import Path

          ui = Path('fastdm/ui.py')
          text = ui.read_text(encoding='utf-8')
          text = text.replace('        main.addLayout(side)', '        main.addWidget(sidebar)')
          text = text.replace('        main.addWidget(side)', '        main.addWidget(sidebar)')
          ui.write_text(text, encoding='utf-8')

          project = Path('pyproject.toml')
          text = project.read_text(encoding='utf-8')
          text = text.replace('version = "0.1.0"', 'version = "0.1.6"', 1)
          project.write_text(text, encoding='utf-8')

      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastdm/ui.py pyproject.toml
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "fix: repair Qt widget ownership and bump v0.1.6"
            git push origin HEAD:main
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Qt startup smoke test
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from fastdm.ui import MainWindow; app=QApplication([]); w=MainWindow(); assert w.nav_status.text().startswith('Showing'); w.close(); print('Qt startup smoke test passed')"

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path dist/Fast-Download-Manager.exe)) { throw 'EXE was not generated' }
          $size = (Get-Item dist/Fast-Download-Manager.exe).Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "EXE verified: $size bytes"
          & dist/Fast-Download-Manager.exe --help 2>$null

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/Fast-Download-Manager.exe -Algorithm SHA256).Hash
          "$hash  Fast-Download-Manager.exe" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Publish v0.1.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6
          name: Fast Download Manager v0.1.6
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
