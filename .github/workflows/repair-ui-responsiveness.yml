name: Repair UI Responsiveness

# Trigger marker: repair the UI responsiveness path on the next main push.

on:
  push:
    branches: [main]
    paths:
      - 'fastdm/ui.py'
      - '.github/workflows/repair-ui-responsiveness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', 'perf: throttle worker signal delivery and UI persistence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch worker and UI progress pipeline
        shell: python
        run: |
          from pathlib import Path

          path = Path('fastdm/ui.py')
          text = path.read_text(encoding='utf-8')

          old_worker = '''    @Slot()\n    def run(self):\n        try:\n            result = asyncio.run(self.engine.download(self.task, self.progress.emit))\n            self.finished.emit(result)\n        except asyncio.CancelledError:\n            self.finished.emit(self.task)\n        except Exception as exc:  # noqa: BLE001\n            self.failed.emit(str(exc))\n'''
          new_worker = '''    @Slot()\n    def run(self):\n        last_emit = 0.0\n\n        def report(task):\n            nonlocal last_emit\n            now = __import__('time').monotonic()\n            terminal = task.status in {\"completed\", \"failed\", \"cancelled\", \"paused\", \"scheduled\", \"queued\"}\n            if terminal or now - last_emit >= 0.10:\n                last_emit = now\n                self.progress.emit(task)\n\n        try:\n            result = asyncio.run(self.engine.download(self.task, report))\n            self.finished.emit(result)\n        except asyncio.CancelledError:\n            self.finished.emit(self.task)\n        except Exception as exc:  # noqa: BLE001\n            self.failed.emit(str(exc))\n'''
          if old_worker not in text:
              raise SystemExit('Worker.run anchor not found')
          text = text.replace(old_worker, new_worker, 1)

          old_progress = '''    def progress(self, task: DownloadTask):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._save(task)\n        self._refresh_stats()\n        self._apply_filters()\n'''
          new_progress = '''    def progress(self, task: DownloadTask, force: bool = False):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        now = __import__('time').monotonic()\n        terminal = task.status in {\"completed\", \"failed\", \"cancelled\", \"paused\", \"scheduled\", \"queued\"}\n        if not force and not terminal and now - self._last_ui_update < 0.10:\n            if now - self._last_ui_save < 1.0:\n                return\n\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._last_ui_update = now\n        if force or terminal or now - self._last_ui_save >= 1.0:\n            self._save(task)\n            self._last_ui_save = now\n        self._refresh_stats()\n        self._apply_filters()\n'''
          if old_progress in text:
              text = text.replace(old_progress, new_progress, 1)
          elif '    def progress(self, task: DownloadTask, force: bool = False):' not in text:
              raise SystemExit('progress method anchor not found')

          text = text.replace('        self.progress(task)\n        if task.status == \"completed\":', '        self.progress(task, force=True)\n        if task.status == \"completed\":', 1)
          text = text.replace('        self.progress(task)\n        self._notify(\"Download failed\"', '        self.progress(task, force=True)\n        self._notify(\"Download failed\"', 1)

          path.write_text(text, encoding='utf-8')

      - name: Add regression test for signal throttling
        shell: python
        run: |
          from pathlib import Path

          Path('tests/test_ui_responsiveness.py').write_text('''import pytest\n\npytest.importorskip(\"PySide6\")\n\nfrom PySide6.QtWidgets import QApplication\n\nfrom fastdm.engine import DownloadTask\nfrom fastdm.ui import Worker\n\n\nclass BurstEngine:\n    async def download(self, task, report):\n        for _ in range(100):\n            report(task)\n        task.status = \"completed\"\n        report(task)\n        return task\n\n\ndef test_worker_throttles_progress_signal_burst(tmp_path):\n    app = QApplication.instance() or QApplication([])\n    worker = Worker(BurstEngine(), DownloadTask(\"t\", \"https://example.com/file.bin\", tmp_path / \"file.bin\"))\n    events = []\n    worker.progress.connect(events.append)\n    worker.run()\n    app.processEvents()\n    assert len(events) <= 3\n    assert events[-1].status == \"completed\"\n''', encoding='utf-8')

      - name: Validate source
        run: |
          python -m compileall -q fastdm tests/test_ui_responsiveness.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastdm/ui.py tests/test_ui_responsiveness.py
          git diff --cached --quiet && exit 0
          git commit -m "perf: throttle worker signal delivery and UI persistence"
          git push origin HEAD:main
