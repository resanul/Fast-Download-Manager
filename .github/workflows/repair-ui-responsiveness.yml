name: Repair UI Responsiveness

on:
  push:
    branches: [main]
    paths:
      - 'fastdm/ui.py'
      - '.github/workflows/repair-ui-responsiveness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', 'perf: throttle UI refresh and database writes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UI progress pipeline
        shell: python
        run: |
          from pathlib import Path

          path = Path('fastdm/ui.py')
          text = path.read_text(encoding='utf-8')

          old_init = '''        self._force_exit = False\n        self._filter = "all"\n        self._build_shell()'''
          new_init = '''        self._force_exit = False\n        self._filter = "all"\n        self._last_ui_update = 0.0\n        self._last_ui_save = 0.0\n        self._build_shell()'''
          if old_init not in text:
              raise SystemExit('MainWindow progress timing anchor not found')
          text = text.replace(old_init, new_init, 1)

          old_progress = '''    def progress(self, task: DownloadTask):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._save(task)\n        self._refresh_stats()\n        self._apply_filters()\n'''
          new_progress = '''    def progress(self, task: DownloadTask, force: bool = False):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        now = __import__("time").monotonic()\n        terminal = task.status in {"completed", "failed", "cancelled", "paused", "scheduled", "queued"}\n\n        # Download workers can emit progress for every network chunk. Never let\n        # that signal storm monopolize the Qt event loop or issue an SQLite\n        # write for every chunk. UI paints are capped at ~10 Hz and persistence\n        # is capped at ~1 Hz, with terminal state updates written immediately.\n        if not force and not terminal and now - self._last_ui_update < 0.10:\n            if now - self._last_ui_save < 1.0:\n                return\n\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._last_ui_update = now\n\n        if force or terminal or now - self._last_ui_save >= 1.0:\n            self._save(task)\n            self._last_ui_save = now\n\n        self._refresh_stats()\n        self._apply_filters()\n'''
          if old_progress not in text:
              raise SystemExit('progress method anchor not found')
          text = text.replace(old_progress, new_progress, 1)

          text = text.replace('        self.progress(task)\n        if task.status == "completed":', '        self.progress(task, force=True)\n        if task.status == "completed":', 1)
          text = text.replace('        self.progress(task)\n        self._notify("Download failed"', '        self.progress(task, force=True)\n        self._notify("Download failed"', 1)

          path.write_text(text, encoding='utf-8')

      - name: Add responsiveness regression test
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_ui_responsiveness.py')
          path.write_text('''import time\n\nimport pytest\n\npytest.importorskip("PySide6")\n\nfrom fastdm.ui import MainWindow\nfrom fastdm.engine import DownloadTask\nfrom pathlib import Path\n\n\ndef test_progress_is_throttled(monkeypatch, tmp_path):\n    window = object.__new__(MainWindow)\n    window.rows = {}\n    window._last_ui_update = time.monotonic()\n    window._last_ui_save = time.monotonic()\n    window._refresh_stats = lambda: None\n    window._apply_filters = lambda: None\n    window._save = lambda task: (_ for _ in ()).throw(AssertionError("progress save should be throttled"))\n    task = DownloadTask("t", "https://example.com/file.bin", Path(tmp_path / "file.bin"))\n    task.status = "downloading"\n    window.progress(task)\n''', encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastdm/ui.py tests/test_ui_responsiveness.py
          git diff --cached --quiet && exit 0
          git commit -m "perf: throttle UI refresh and database writes"
          git push origin HEAD:main
