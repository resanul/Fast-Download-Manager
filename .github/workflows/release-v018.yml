name: Publish Fast Download Manager v0.1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v018.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsiveness patch in build workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path('fastdm/ui.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport time\n' not in text:
              text = text.replace('import sys\n', 'import sys\nimport time\n', 1)

          old_worker = '''    @Slot()\n    def run(self):\n        try:\n            result = asyncio.run(self.engine.download(self.task, self.progress.emit))\n            self.finished.emit(result)\n        except asyncio.CancelledError:\n            self.finished.emit(self.task)\n        except Exception as exc:  # noqa: BLE001\n            self.failed.emit(str(exc))\n'''
          new_worker = '''    @Slot()\n    def run(self):\n        last_emit = 0.0\n\n        def report(task):\n            nonlocal last_emit\n            now = time.monotonic()\n            terminal = task.status in {\"completed\", \"failed\", \"cancelled\", \"paused\", \"scheduled\", \"queued\"}\n            if terminal or now - last_emit >= 0.10:\n                last_emit = now\n                self.progress.emit(task)\n\n        try:\n            result = asyncio.run(self.engine.download(self.task, report))\n            self.finished.emit(result)\n        except asyncio.CancelledError:\n            self.finished.emit(self.task)\n        except Exception as exc:  # noqa: BLE001\n            self.failed.emit(str(exc))\n'''
          if old_worker in text:
              text = text.replace(old_worker, new_worker, 1)

          old_progress = '''    def progress(self, task: DownloadTask):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._save(task)\n        self._refresh_stats()\n        self._apply_filters()\n'''
          if old_progress in text:
              new_progress = '''    def progress(self, task: DownloadTask, force: bool = False):\n        row = self.rows.get(task.id)\n        if row is None:\n            return\n        now = time.monotonic()\n        terminal = task.status in {\"completed\", \"failed\", \"cancelled\", \"paused\", \"scheduled\", \"queued\"}\n        if not force and not terminal and now - self._last_ui_update < 0.10:\n            return\n\n        bar_widget = self.table.cellWidget(row, 1)\n        if bar_widget:\n            bar = bar_widget.findChild(QProgressBar)\n            if bar:\n                bar.setValue(min(100, int(task.downloaded * 100 / task.total)) if task.total else 0)\n        self.table.item(row, 2).setText(self.fmt(task.total))\n        self.table.item(row, 3).setText(self._pretty_status(task.status))\n        self.table.item(row, 4).setText(self._format_rate(task.speed))\n        self.table.item(row, 5).setText(self.priorities.get(task.id, Priority.NORMAL).name.title())\n        self._last_ui_update = now\n\n        if force or terminal or now - self._last_ui_save >= 1.0:\n            self._save(task)\n            self._last_ui_save = now\n\n        self._refresh_stats()\n        if terminal or force:\n            self._apply_filters()\n'''
              start = text.find('    def progress(self, task: DownloadTask')
              end = text.find('\n    def done(', start)
              text = text[:start] + new_progress + text[end:]
          if '_last_ui_update = 0.0' not in text:
              text = text.replace('        self._filter = \"all\"\n', '        self._filter = \"all\"\n        self._last_ui_update = 0.0\n        self._last_ui_save = 0.0\n', 1)
          text = text.replace('        self.progress(task)\n        if task.status == \"completed\":', '        self.progress(task, force=True)\n        if task.status == \"completed\":', 1)
          text = text.replace('        self.progress(task)\n        self._notify(\"Download failed\"', '        self.progress(task, force=True)\n        self._notify(\"Download failed\"', 1)
          path.write_text(text, encoding='utf-8')

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path dist/Fast-Download-Manager.exe)) { throw 'EXE was not generated' }
          $size = (Get-Item dist/Fast-Download-Manager.exe).Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "EXE verified: $size bytes"

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/Fast-Download-Manager.exe -Algorithm SHA256).Hash
          "$hash  Fast-Download-Manager.exe" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Publish v0.1.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.8
          name: Fast Download Manager v0.1.8
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
