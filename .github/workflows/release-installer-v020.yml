name: Publish Windows Installer v0.2.0

on:
  push:
    branches: [main]
    paths:
      - 'installer/FastDownloadManager.iss'
      - 'fastdm/__main__.py'
      - 'fastdm/single_instance.py'
      - 'pyproject.toml'
      - '.github/workflows/release-installer-v020.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      APP_VERSION: '0.2.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build application EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DMyAppVersion=$env:APP_VERSION' 'installer\FastDownloadManager.iss'

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'dist\installer\Fast-Download-Manager-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not generated' }
          $size = (Get-Item $installer).Length
          if ($size -lt 1000000) { throw "Installer unexpectedly small: $size bytes" }
          Write-Host "Installer verified: $size bytes"

      - name: Generate checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash 'dist\Fast-Download-Manager.exe' -Algorithm SHA256).Hash
          $installerHash = (Get-FileHash 'dist\installer\Fast-Download-Manager-Setup.exe' -Algorithm SHA256).Hash
          @(
            "$exeHash  Fast-Download-Manager.exe"
            "$installerHash  Fast-Download-Manager-Setup.exe"
          ) | Out-File 'SHA256SUMS.txt' -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Fast Download Manager v0.2.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/installer/Fast-Download-Manager-Setup.exe
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
