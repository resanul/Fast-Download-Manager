name: Repair Release

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Verify EXE exists
        shell: powershell
        run: |
          if (-not (Test-Path 'dist/Fast-Download-Manager.exe')) {
            throw 'EXE was not produced.'
          }
          $size = (Get-Item 'dist/Fast-Download-Manager.exe').Length
          if ($size -lt 1000000) {
            throw "EXE size is unexpectedly small: $size bytes"
          }
          Write-Host "EXE size: $size bytes"

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/Fast-Download-Manager.exe -Algorithm SHA256).Hash
          "$hash  Fast-Download-Manager.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish v0.1.1
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.1
          name: Fast Download Manager v0.1.1
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
