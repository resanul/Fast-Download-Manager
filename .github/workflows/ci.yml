name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Unit and UI tests
        run: pytest

  windows-build:
    name: Windows packaging smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'dist\Fast-Download-Manager.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not generated' }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "Verified: $exe ($size bytes)"
      - name: Windows EXE startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist\Fast-Download-Manager.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "EXE exited during startup with code $($process.ExitCode)"
            }
            Write-Host "Startup smoke test passed (PID $($process.Id))"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer smoke package
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DMyAppVersion=0.2.0' 'installer\FastDownloadManager.iss'
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'dist\installer\Fast-Download-Manager-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not generated' }
          $size = (Get-Item $installer).Length
          if ($size -lt 1000000) { throw "Installer unexpectedly small: $size bytes" }
          Write-Host "Verified: $installer ($size bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fast-Download-Manager-windows-ci
          path: |
            dist/Fast-Download-Manager.exe
            dist/installer/Fast-Download-Manager-Setup.exe
