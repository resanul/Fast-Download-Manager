name: Publish Fast Download Manager v0.1.9

on:
  push:
    branches: [main]
    paths:
      - 'fastdm/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/release-v019.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Qt startup smoke test
        shell: powershell
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from fastdm.ui import MainWindow; app=QApplication([]); w=MainWindow(); w.show(); app.processEvents(); assert w.nav_status.text().startswith('Showing'); w.close(); print('Qt startup smoke test passed')"

      - name: Advanced dialog smoke test
        shell: powershell
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from pathlib import Path; from fastdm.download_dialogs import DownloadFileInfoDialog, DownloadStatusDialog; app=QApplication([]); a=DownloadFileInfoDialog(url='https://example.com/file.zip',filename='file.zip',default_folder=Path.cwd()); b=DownloadStatusDialog(filename='file.zip',url='https://example.com/file.zip',total=1000); b.update_download(downloaded=500,total=1000,speed=250,status='Downloading'); assert b.progress.value()==50; a.close(); b.close(); print('Advanced dialogs smoke test passed')"

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Fast-Download-Manager fastdm/__main__.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path dist/Fast-Download-Manager.exe)) { throw 'EXE was not generated' }
          $size = (Get-Item dist/Fast-Download-Manager.exe).Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "EXE verified: $size bytes"

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/Fast-Download-Manager.exe -Algorithm SHA256).Hash
          "$hash  Fast-Download-Manager.exe" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Publish v0.1.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.9
          name: Fast Download Manager v0.1.9
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Fast-Download-Manager.exe
            SHA256SUMS.txt
